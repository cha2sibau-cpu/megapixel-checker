<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Megapixel Checker</title>
  <link rel="icon" type="image/png" href="logo-mpc.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Outfit", sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 1fr;
    }

    header {
      border-bottom: 1px solid #ddd;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #000;
    }

    header span {
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: #aaa;
      text-transform: uppercase;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      gap: 0;
    }

    #drop-zone {
      width: 560px;
      max-width: 100%;
      height: 320px;
      border: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
      overflow: hidden;
    }

    #drop-zone.drag-over {
      border-color: #000;
      background: #f5f5f5;
    }

    #drop-zone:hover {
      border-color: #999;
    }

    #drop-icon {
      color: #ccc;
      transition: color 0.15s;
    }

    #drop-zone.drag-over #drop-icon { color: #000; }

    #drop-label {
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #aaa;
      text-transform: uppercase;
    }

    #drop-label span {
      color: #000;
      cursor: pointer;
      border-bottom: 1px solid #000;
    }

    #file-input { display: none; }

    #preview {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    #drop-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.85);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    #drop-zone.drag-over #drop-overlay {
      display: flex;
    }

    #drop-overlay svg { color: #000; }

    #drop-overlay span {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #000;
    }

    #result {
      display: none;
      width: 560px;
      max-width: 100%;
      border: 1px solid #ccc;
      border-top: none;
      padding: 28px 32px;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    #mp-block {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    #mp-value {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #000;
    }

    #mp-label {
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      color: #aaa;
      text-transform: uppercase;
      align-self: flex-end;
      padding-bottom: 10px;
    }

    #meta {
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }

    #dimensions {
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: #aaa;
    }

    #reset-btn {
      background: none;
      border: 1px solid #ccc;
      color: #aaa;
      padding: 5px 14px;
      cursor: pointer;
      font-family: "Outfit", sans-serif;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s;
    }

    #reset-btn:hover {
      border-color: #000;
      color: #000;
    }

    /* Brackets panel */

    #brackets {
      display: none;
      width: 560px;
      max-width: 100%;
      border: 1px solid #ccc;
      border-top: none;
    }

    #brackets-header {
      padding: 10px 32px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #brackets-header-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #000;
    }

    #brackets-header-sub {
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #aaa;
      text-transform: uppercase;
    }

    .b-row {
      padding: 11px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.1s;
    }

    .b-row:last-child { border-bottom: none; }

    .b-row.b-current {
      background: #fafafa;
      border-left: 2px solid #000;
      padding-left: 30px;
    }

    .b-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .b-name {
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: #aaa;
    }

    .b-row.b-current .b-name {
      font-weight: 700;
      color: #000;
    }

    .b-badge {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      background: #000;
      padding: 2px 7px;
    }

    .b-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .b-safe-mp {
      font-size: 0.75rem;
      font-weight: 400;
      color: #000;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .b-row:not(.b-current) .b-safe-mp {
      color: #888;
    }

    .b-dims {
      font-size: 0.7rem;
      font-weight: 300;
      color: #bbb;
      letter-spacing: 0.05em;
      white-space: nowrap;
      min-width: 140px;
      text-align: right;
    }

    .b-row.b-current .b-dims {
      color: #888;
    }

    .b-multiplier {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #bbb;
      white-space: nowrap;
      min-width: 52px;
      text-align: right;
    }

    .b-row.b-current .b-multiplier {
      color: #000;
    }

    .b-price {
      font-size: 0.75rem;
      font-weight: 400;
      color: #bbb;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .b-row.b-current .b-price {
      color: #000;
      font-weight: 700;
    }

    /* Clarity Pro panel */

    #brackets-clarity {
      display: none;
      width: 560px;
      max-width: 100%;
      border: 1px solid #ccc;
      border-top: none;
    }

    #brackets-clarity-header {
      padding: 10px 32px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #brackets-clarity-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #000;
    }

    #brackets-clarity-sub {
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #aaa;
      text-transform: uppercase;
    }

    .cp-row {
      padding: 11px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f0f0;
    }

    .cp-row:last-child { border-bottom: none; }

    .cp-mult {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #000;
      min-width: 36px;
    }

    .cp-dims {
      font-size: 0.7rem;
      font-weight: 300;
      color: #bbb;
      letter-spacing: 0.05em;
      white-space: nowrap;
      flex: 1;
      text-align: center;
    }

    .cp-mp {
      font-size: 0.75rem;
      font-weight: 400;
      color: #888;
      letter-spacing: 0.04em;
      white-space: nowrap;
      min-width: 80px;
      text-align: right;
    }

    .cp-price {
      font-size: 0.78rem;
      font-weight: 700;
      color: #000;
      letter-spacing: 0.04em;
      white-space: nowrap;
      min-width: 60px;
      text-align: right;
    }

    footer {
      border-top: 1px solid #eee;
      padding: 16px 40px;
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: #ccc;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header>
    <h1>Megapixel Checker</h1>
    <span>Drop. Measure. Done.</span>
  </header>

  <main>
    <div id="drop-zone">
      <svg id="drop-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p id="drop-label">Drop image here or <span onclick="document.getElementById('file-input').click()">browse</span></p>
      <img id="preview" alt="preview">
      <div id="drop-overlay">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>Replace image</span>
      </div>
      <input type="file" id="file-input" accept="image/*">
    </div>

    <div id="result">
      <div id="mp-block">
        <div id="mp-value">—</div>
        <div id="mp-label">Megapixels</div>
      </div>
      <div id="meta">
        <div id="dimensions"></div>
        <button id="reset-btn" onclick="reset()">Clear</button>
      </div>
    </div>

    <div id="brackets">
      <div id="brackets-header">
        <span id="brackets-header-label">Crystal Upscaler brackets</span>
        <span id="brackets-header-sub">safe max · multiplier at current ratio</span>
      </div>
    </div>

    <div id="brackets-clarity">
      <div id="brackets-clarity-header">
        <span id="brackets-clarity-label">Clarity Pro</span>
        <span id="brackets-clarity-sub">$0.03 per million output pixels</span>
      </div>
    </div>
  </main>

  <footer>Calculated in-browser &mdash; no upload</footer>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const preview = document.getElementById('preview');
    const dropLabel = document.getElementById('drop-label');
    const dropIcon = document.getElementById('drop-icon');
    const result = document.getElementById('result');
    const mpValue = document.getElementById('mp-value');
    const dimensions = document.getElementById('dimensions');
    const bracketsEl = document.getElementById('brackets');
    const clarityEl = document.getElementById('brackets-clarity');

    const BRACKETS = [
      { min: 0,   max: 4,   price: 0.05 },
      { min: 4,   max: 8,   price: 0.10 },
      { min: 8,   max: 16,  price: 0.20 },
      { min: 16,  max: 25,  price: 0.40 },
      { min: 25,  max: 50,  price: 0.80 },
      { min: 50,  max: 100, price: 1.60 },
      { min: 100, max: 200, price: 3.20 },
    ];

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));

    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) processImage(file);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) processImage(fileInput.files[0]);
    });

    function processImage(file) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const w = img.naturalWidth;
        const h = img.naturalHeight;
        const mp = (w * h) / 1_000_000;

        preview.src = url;
        preview.style.display = 'block';
        dropLabel.style.display = 'none';
        dropIcon.style.display = 'none';

        mpValue.textContent = mp >= 10 ? mp.toFixed(1) : mp.toFixed(2);
        dimensions.textContent = `${w} × ${h} px`;
        result.style.display = 'flex';

        renderBrackets(mp, w, h);
        renderClarityPro(w, h);
      };
      img.src = url;
    }

    function renderBrackets(mp, imgW, imgH) {
      const ratio = imgW / imgH;
      const currentBracket = BRACKETS.find(b => mp >= b.min && mp < b.max) || BRACKETS[BRACKETS.length - 1];

      // Remove old rows (keep the header)
      const header = document.getElementById('brackets-header');
      while (bracketsEl.lastChild !== header) {
        bracketsEl.removeChild(bracketsEl.lastChild);
      }

      BRACKETS.forEach(b => {
        const isCurrent = b === currentBracket;
        const safeMP = b.max - 1;
        const totalPx = safeMP * 1_000_000;
        const safeH = Math.round(Math.sqrt(totalPx / ratio));
        const safeW = Math.round(safeH * ratio);
        const multiplier = Math.sqrt(safeMP / mp);
        const multiplierStr = multiplier.toFixed(2) + '×';

        const row = document.createElement('div');
        row.className = 'b-row' + (isCurrent ? ' b-current' : '');

        row.innerHTML = `
          <div class="b-left">
            <span class="b-name">${b.min} – ${b.max} MP</span>
            ${isCurrent ? '<span class="b-badge">Current</span>' : ''}
          </div>
          <div class="b-right">
            <span class="b-safe-mp">safe max ${safeMP} MP</span>
            <span class="b-price">$${b.price.toFixed(2)}</span>
            <span class="b-multiplier">${multiplierStr}</span>
            <span class="b-dims">${safeW} × ${safeH} px</span>
          </div>
        `;

        bracketsEl.appendChild(row);
      });

      bracketsEl.style.display = 'block';
    }

    function renderClarityPro(w, h) {
      const header = document.getElementById('brackets-clarity-header');
      while (clarityEl.lastChild !== header) {
        clarityEl.removeChild(clarityEl.lastChild);
      }

      [2, 4, 8, 16].forEach(n => {
        const outW = w * n;
        const outH = h * n;
        const outPx = outW * outH;
        const outMp = outPx / 1_000_000;
        const price = outPx / 1_000_000 * 0.03;
        const mpStr = outMp >= 10 ? outMp.toFixed(1) : outMp.toFixed(2);

        const row = document.createElement('div');
        row.className = 'cp-row';
        row.innerHTML = `
          <span class="cp-mult">${n}×</span>
          <span class="cp-dims">${outW} × ${outH} px</span>
          <span class="cp-mp">${mpStr} MP</span>
          <span class="cp-price">$${price.toFixed(2)}</span>
        `;
        clarityEl.appendChild(row);
      });

      clarityEl.style.display = 'block';
    }

    function reset() {
      preview.style.display = 'none';
      preview.src = '';
      dropLabel.style.display = '';
      dropIcon.style.display = '';
      result.style.display = 'none';
      bracketsEl.style.display = 'none';
      clarityEl.style.display = 'none';
      fileInput.value = '';
    }
  </script>
</body>
</html>
